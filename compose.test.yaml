name: graphql-tests
services:
  postgres:
    image: postgres:17-alpine
    cpus: ${FOREMAN_CODE_CI_DATABASE_CPUS:-0}
    # Lowest CPU priority, like the CI jobs themselves, so a Main that also runs CI keeps its own database responsive.
    cpu_shares: 2
    mem_limit: ${FOREMAN_CODE_CI_DATABASE_MEMORY_BYTES:-0}
    # The disposable instance can be rebuilt from fixtures after a host crash.
    command: ["postgres", "-c", "max_connections=300", "-c", "max_locks_per_transaction=512",
      "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_DB: graphql_test_control
      POSTGRES_USER: graphql_test_admin
      POSTGRES_PASSWORD: graphql_test_disposable_only
    ports:
      - "127.0.0.1:${FOREMAN_CODE_CI_DATABASE_PORT:-55439}:5432"
    healthcheck:
      # TCP only: the entrypoint's socket-only bootstrap server must not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U graphql_test_admin -d graphql_test_control"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - graphql-test-data:/var/lib/postgresql/data
    labels:
      graphql.test-owner: disposable-tests
volumes:
  graphql-test-data:
    labels:
      graphql.test-owner: disposable-tests
